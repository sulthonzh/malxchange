# malxchange single-host stack (ADR-0007). Container list: caddy, postgres,
# redpanda, redpanda-console (loopback-only), the five services, pg-backup,
# and btcd/ltcd behind the `chains` profile. No Redis.
#
# The web/admin SSR containers land with issues #24/#25 (their build
# contexts don't exist yet); see the commented block at the bottom.
#
# Project directory = this file's directory, so `deploy/.env` supplies all
# ${VARS} (generated by install/install.sh, never committed).
name: malxchange

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redpanda:
      condition: service_healthy
    redpanda-setup:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "/app", "-healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 15s

x-service-env: &service-env
  MAL_PG_HOST: postgres
  MAL_PG_DATABASE: ${MAL_PG_DATABASE:-malxchange}
  MAL_KAFKA_SEEDS: redpanda:9092
  MAL_KAFKA_USER: ${MAL_KAFKA_USER}
  MAL_KAFKA_PASSWORD: ${MAL_KAFKA_PASSWORD}

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MAL_PG_SUPERUSER:-malxchange}
      POSTGRES_PASSWORD: ${MAL_PG_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${MAL_PG_DATABASE:-malxchange}
      # consumed by the init script to mint one login role per service
      MAL_PG_PASSWORD_API: ${MAL_PG_PASSWORD_API}
      MAL_PG_PASSWORD_EXCHANGE: ${MAL_PG_PASSWORD_EXCHANGE}
      MAL_PG_PASSWORD_MARKET: ${MAL_PG_PASSWORD_MARKET}
      MAL_PG_PASSWORD_WALLET: ${MAL_PG_PASSWORD_WALLET}
      MAL_PG_PASSWORD_ADMIN: ${MAL_PG_PASSWORD_ADMIN}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 24

  # SASL (SCRAM-SHA-256) verified against this exact command on v25.1.12:
  # unauthenticated produce/consume fails closed, admin API mints the user.
  # Topic auto-creation is off; services create what they own at boot.
  redpanda:
    image: docker.io/redpandadata/redpanda:v25.1.12
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:9092
      - --set
      - redpanda.enable_sasl=true
      - --set
      - redpanda.sasl_mechanisms=SCRAM-SHA-256
      - --set
      - redpanda.auto_create_topics_enabled=false
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      # Admin API answers on localhost when the node is up; SASL never
      # applies to it (rpk cluster health exits 0 even when unreachable,
      # so curl is the reliable probe).
      test: ["CMD-SHELL", "curl -fsS http://localhost:9644/v1/status/ready >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 10s

  # One-shot: mint the SASL user (idempotent — checks the list first).
  redpanda-setup:
    image: docker.io/redpandadata/redpanda:v25.1.12
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if rpk acl user list -X admin.hosts=redpanda:9644 2>/dev/null | grep -qx "${MAL_KAFKA_USER}"; then
          echo "redpanda-setup: user ${MAL_KAFKA_USER} already exists"
        else
          rpk acl user create "${MAL_KAFKA_USER}" -p "${MAL_KAFKA_PASSWORD}" -X admin.hosts=redpanda:9644
          echo "redpanda-setup: created ${MAL_KAFKA_USER}"
        fi
        # v1 runs one app principal for all services (single host, broker
        # not exposed); SASL authenticates it, superuser authorizes it.
        rpk cluster config set superusers "[\"${MAL_KAFKA_USER}\"]" --api-urls redpanda:9644
        echo "redpanda-setup: ${MAL_KAFKA_USER} registered as superuser"

  # Broker UI, admin-gated by binding to the host loopback only — never
  # proxied through Caddy. Reach it over SSH: ssh -L 8090:localhost:8090.
  redpanda-console:
    image: docker.io/redpandadata/console:v3.2.0
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SASL_ENABLED: "true"
      KAFKA_SASL_USERNAME: ${MAL_KAFKA_USER}
      KAFKA_SASL_MECHANISM: SCRAM-SHA-256
      KAFKA_SASL_PASSWORD: ${MAL_KAFKA_PASSWORD}

  api:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: api }
    image: malxchange/api:latest
    environment:
      <<: *service-env
      MAL_PG_PASSWORD: ${MAL_PG_PASSWORD_API}
      MAL_API_SMTP_HOST: ${MAL_API_SMTP_HOST}
      MAL_API_SMTP_PORT: ${MAL_API_SMTP_PORT:-25}
      MAL_API_SMTP_USER: ${MAL_API_SMTP_USER}
      MAL_API_SMTP_PASS: ${MAL_API_SMTP_PASS}
      MAL_API_SMTP_FROM: ${MAL_API_SMTP_FROM:-malxchange@localhost}
      MAL_API_CODE_TTL: ${MAL_API_CODE_TTL:-5m}
      MAL_API_CODE_COOLDOWN: ${MAL_API_CODE_COOLDOWN:-30s}
      MAL_API_LOCKOUT_WINDOW: ${MAL_API_LOCKOUT_WINDOW:-15m}
      MAL_API_SESSION_TTL: ${MAL_API_SESSION_TTL:-168h}

  exchange:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: exchange }
    image: malxchange/exchange:latest
    environment:
      <<: *service-env
      MAL_PG_PASSWORD: ${MAL_PG_PASSWORD_EXCHANGE}

  market:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: market }
    image: malxchange/market:latest
    environment:
      <<: *service-env
      MAL_PG_PASSWORD: ${MAL_PG_PASSWORD_MARKET}

  wallet:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: wallet }
    image: malxchange/wallet:latest
    environment:
      <<: *service-env
      MAL_PG_PASSWORD: ${MAL_PG_PASSWORD_WALLET}
      # chains profile endpoints (unset = watch-only for that family)
      MAL_BTCD_URL: ${MAL_BTCD_URL:-https://btcd:8334}
      MAL_BTCD_RPCUSER: ${MAL_BTCD_RPCUSER:-malxchange}
      MAL_BTCD_RPCPASSWORD: ${MAL_BTCD_RPCPASSWORD}
      MAL_LTCD_URL: ${MAL_LTCD_URL:-https://ltcd:9334}
      MAL_LTCD_RPCUSER: ${MAL_LTCD_RPCUSER:-malxchange}
      MAL_LTCD_RPCPASSWORD: ${MAL_LTCD_RPCPASSWORD}
      MAL_EVM_RPC_URL: ${MAL_EVM_RPC_URL:-}
      MAL_EVM_RPC_FALLBACK_URL: ${MAL_EVM_RPC_FALLBACK_URL:-}
      MAL_TRON_ENDPOINT: ${MAL_TRON_ENDPOINT:-}
      MAL_TRON_API_KEY: ${MAL_TRON_API_KEY:-}
      MAL_CHAIN_TLS_SKIP_VERIFY: "true" # self-signed node certs inside compose
      MAL_WALLET_KEYSTORE: ${MAL_WALLET_KEYSTORE:-}
      MAL_HOT_KEYSTORE_PASSPHRASE: ${MAL_HOT_KEYSTORE_PASSPHRASE:-}

  admin:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: admin-api }
    image: malxchange/admin:latest
    environment:
      <<: *service-env
      MAL_PG_PASSWORD: ${MAL_PG_PASSWORD_ADMIN}

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MAL_DOMAIN: ${MAL_DOMAIN}
      MAL_ADMIN_DOMAIN: ${MAL_ADMIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "adapt", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 10

  pg-backup:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${MAL_PG_SUPERUSER:-malxchange}
      PGPASSWORD: ${MAL_PG_SUPERUSER_PASSWORD}
      PGDATABASE: ${MAL_PG_DATABASE:-malxchange}
      MAL_BACKUP_KEEP: ${MAL_BACKUP_KEEP:-14}
    volumes:
      - ${MAL_BACKUP_DIR:-./backups}:/backups
      - ./pg-backup/backup.sh:/opt/backup.sh:ro
    entrypoint: ["/bin/sh", "/opt/backup.sh"]

  # Chain nodes (ADR-0007/0008): own pruned-style full nodes for BTC/LTC
  # deposit watching, no third-party explorer in the truth path. Mainnet
  # by default; the test profile overrides to simnet. RPC stays on the
  # internal compose network (--notls). Disk-heavy.
  btcd:
    build:
      context: ./chains
      dockerfile: Dockerfile.btcd
    image: malxchange/btcd:latest
    profiles: ["chains"]
    restart: unless-stopped
    command:
      - --txindex
      - --rpclisten=0.0.0.0:8334
      - --rpcuser=${MAL_BTCD_RPCUSER:-malxchange}
      - --rpcpass=${MAL_BTCD_RPCPASSWORD}
    volumes:
      - btcd_data:/root/.btcd

  ltcd:
    build:
      context: ./chains
      dockerfile: Dockerfile.ltcd
    image: malxchange/ltcd:latest
    profiles: ["chains"]
    restart: unless-stopped
    command:
      - --txindex
      - --rpclisten=0.0.0.0:9334
      - --rpcuser=${MAL_LTCD_RPCUSER:-malxchange}
      - --rpcpass=${MAL_LTCD_RPCPASSWORD}
    volumes:
      - ltcd_data:/root/.ltcd

  # web (member front, SSR) and admin (back office, SSR) join here when
  # their build contexts land:
  #
  # web:
  #   build: { context: ../apps/web }   # issue #24
  #   restart: unless-stopped
  # admin:
  #   build: { context: ../apps/admin } # issue #25
  #   restart: unless-stopped

volumes:
  postgres_data:
  redpanda_data:
  caddy_data:
  caddy_config:
  btcd_data:
  ltcd_data:
