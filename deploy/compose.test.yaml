# Test profile (system black-box seam substrate, spec #20): the same
# infra services plus deterministically-minable chains — btcd/ltcd in
# simnet and an EVM devnet (anvil) for ETH/ERC-20. TRC-20 has no light
# devnet; the stubbed java-tron gRPC service lands with the wallet slice
# (#22), which defines its behavior.
#
# Usage (from deploy/):
#   docker compose -f docker-compose.yaml -f compose.test.yaml --profile test up -d
#
# btcd/ltcd RPC uses the node's own self-signed TLS; probes use https -k.
services:
  # The test profile also publishes the dev-infra loopback ports so
  # `make test-integration` (5432) and the service suite can run
  # against it without the dev override.
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redpanda:
    ports:
      - "127.0.0.1:9092:29092"
  btcd:
    profiles: ["test"]
    command:
      - --simnet
      - --txindex
      - --rpclisten=0.0.0.0:18556
      - --rpcuser=${MAL_BTCD_RPCUSER:-malxchange}
      - --rpcpass=${MAL_BTCD_RPCPASSWORD}
      # coinbase pays the fixed test key m/84'/0'/0'/0/0 of the
      # "abandon…about" mnemonic (cmd/devkeys prints it): tests hold
      # the spending key, the node holds no wallet at all.
      - --miningaddr=sb1qcr8te4kr609gcawutmrza0j4xv80jy8z7w2lls
    ports:
      - "127.0.0.1:18556:18556"
    volumes: []

  ltcd:
    profiles: ["test"]
    command:
      - --simnet
      # --txindex for parity with btcd: RPC.Depth/getrawtransaction needs
      # the tx index for UTXO families (ltcd panics in versionbits on
      # `generate`, so E2E mining is skipped, but read-only RPC parity holds).
      - --txindex
      # same fixed-key scheme on the LTC path m/84'/2'/0'/0/0
      - --miningaddr=sltc1qjmxnz78nmc8nq77wuxh25n2es7rzm5c2y2c6jx
      - --rpclisten=0.0.0.0:19556
      - --rpcuser=${MAL_LTCD_RPCUSER:-malxchange}
      - --rpcpass=${MAL_LTCD_RPCPASSWORD}
    ports:
      - "127.0.0.1:19556:19556"
    volumes: []

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles: ["test"]
    restart: unless-stopped
    # the image entrypoint is /bin/sh -c; bypass it so argv survives
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "127.0.0.1:8545:8545"

  # Fake java-tron gRPC node (test infra, NOT a chain: no signature
  # validation, in-RAM ledger — see cmd/tronstub). The wallet's chain
  # E2E drives it in-process; this container serves the composed stack
  # and CI probes.
  tronstub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: tronstub }
    image: malxchange/tronstub:latest
    profiles: ["test"]
    restart: unless-stopped
    command: ["--addr", ":50051", "--mine-interval", "1s"]
    ports:
      - "127.0.0.1:50051:50051"

  # Test key ceremony (one-shot, cmd/devkeys): registers the fixed test
  # mnemonic's watch-only xpubs on the Coins so deposit-address
  # derivation works. Runs after the wallet has migrated the coins
  # table; idempotent at every boot.
  wallet-keys:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: devkeys }
    image: malxchange/devkeys:latest
    profiles: ["test"]
    environment:
      MAL_PG_HOST: postgres
      MAL_PG_USER: wallet
      MAL_PG_PASSWORD: ${MAL_PG_PASSWORD_WALLET}
      MAL_PG_DATABASE: malxchange
      MAL_PG_SCHEMA: wallet
    depends_on:
      wallet:
        condition: service_healthy
    restart: "no"

  # Member E2E (spec #24, issue #51): the web SSR container and the
  # in-compose mail sink, plus the api's mail knobs and the
  # E2E-specific host bindings Playwright reaches (:18080 api,
  # :3000 web, :18025 mail UI). The web build context is the checked-in
  # Nuxt app (apps/web/Dockerfile).
  web:
    build: { context: ../apps/web, dockerfile: Dockerfile }
    image: malxchange/web:latest
    restart: unless-stopped
    profiles: ["e2e"]
    environment:
      # Browser origins point at the Caddy edge (published 443): the
      # api and WebSocket are same-origin there, exactly as production.
      # SSR runs inside the compose network and uses the service
      # address directly.
      NUXT_API_BASE_URL: http://api:8080/api
      NUXT_PUBLIC_API_BASE_URL: https://exchange.example.com/api
      NUXT_PUBLIC_WS_URL: wss://exchange.example.com/ws
    ports:
      - "127.0.0.1:3000:3000"

  # Admin E2E (spec #25, issue #56): the admin SSR container joins the
  # e2e profile behind the same Caddy edge — the browser speaks
  # https://admin.exchange.example.com (host-resolver mapped), where
  # /api/* proxies to admin-api. SSR reaches admin-api over the
  # compose network directly.
  admin:
    build: { context: ../apps/admin, dockerfile: Dockerfile }
    image: malxchange/admin:latest
    restart: unless-stopped
    profiles: ["e2e"]
    environment:
      NUXT_ADMIN_API_BASE_URL: http://admin-api:8080
      NUXT_PUBLIC_ADMIN_API_BASE_URL: https://admin.exchange.example.com
    ports:
      - "127.0.0.1:3100:3000"
  api:
    environment:
      MAL_API_SMTP_HOST: mailsink
      MAL_API_SMTP_PORT: "1025"
      MAL_API_SMTP_FROM: malxchange@localhost
    profiles: ["test"]
    ports:
      - "127.0.0.1:18080:8080"
    # The admin channels journey points the sms driver's endpoint at
    # http://host.docker.internal:<sink-port>/sms (a listener on the
    # test runner's host). Linux-engine runners resolve that name only
    # with this mapping; Docker Desktop and colima inject it already,
    # so the entry is a no-op for them (#72).
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mailsink:
    image: docker.io/axllent/mailpit:v1.21
    profiles: ["test"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:18025:8025"
      - "127.0.0.1:11025:1025"
